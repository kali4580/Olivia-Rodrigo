<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUR Era 🦋</title>
    <style>
        body {
            background-color: #dfd5f0; 
            color: #3d1d6d;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        marquee {
            background-color: #ba9fe3;
            color: white;
            padding: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            width: 100%;
        }
        .scrapbook {
            max-width: 500px;
            background: white;
            padding: 30px;
            margin: 40px auto;
            border-radius: 10px;
            box-shadow: 8px 8px 0px #ba9fe3;
            border: 2px solid #3d1d6d;
            text-align: center;
        }
        h1 { font-size: 2.5rem; text-transform: lowercase; }
        .sticker {
            display: inline-block;
            background: #fffbcf;
            padding: 5px 10px;
            border: 1px dashed #eedb3d;
            transform: rotate(-5deg);
            font-weight: bold;
            margin: 10px;
        }
        ul { list-style-type: '🦋 '; text-align: left; display: inline-block; }
        li { margin: 10px 0; font-size: 1.1rem; }
    </style>
</head>
<body>
    <marquee>🦋 God, it's brutal out here... 🦋 Do you get déjà vu? 🦋</marquee>
    <div class="scrapbook">
        <h1>sour era ★</h1>
        <div class="sticker">DEJA VU</div>
        <div class="sticker" style="transform: rotate(5deg); background: #ffdfdf; border-color: #ff9e9e;">BRUTAL</div>
        <p>where the butterfly stickers and heartbreak started.</p>
        <h3>tracklist favorites:</h3>
        <ul>
            <li>drivers license</li>
            <li>good 4 u</li>
            <li>traitor</li>
            <li>jealousy, jealousy</li>
        </ul>
    </div>
</body>
</html>
